[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscanner"
version = "0.1.0"
description = "Static vulnerability scanner for public GitHub repositories"
requires-python = ">=3.10"
dependencies = [
    "PyGithub>=2.3.0",
    "requests>=2.32.3",
    "click>=8.1.7",
    "rich>=13.7.1",
    "PyYAML>=6.0.2",
    "Jinja2>=3.1.4",
    # tree-sitter parsers behind the AST analyzers; without them those analyzers are skipped
    "tree-sitter>=0.26.0",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-c-sharp>=0.23.5",
    # Java AST analyzer (not tree-sitter based)
    "javalang>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vulnscan = "vulnscanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vulnscanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
